; PlatformIO project configuration
;
; ATmega328P (Nano等) と ATmega328PB 両対応ビルド
; デフォルト環境は ATmega328P (既存互換)
;
; ビルド切替:
;   pio run -e atmega328p   <- 既存 Nano (atmega328p)
;   pio run -e atmega328pb  <- MiniCore の 328PB バリアント
;   pio run                 <- default_envs で指定された env
;
; 依存:
;   - FastAccelStepper  (gin66)  : 328PB 対応のため scripts/patch_fastaccel.py で 1 行パッチ適用
;   - FastGPIO          (pololu) : 328PB 対応済 (PORTE 含む 26 ピン)、パッチ不要

[platformio]
default_envs = atmega328p

; -----------------------------------------------------------------------------
; 共通: ATmega328P (Nano 等)
; -----------------------------------------------------------------------------
[env:atmega328p]
platform = atmelavr
board = ATmega328P                ; MiniCore の ATmega328P/PA バリアント
framework = arduino               ; -> MiniCore が自動選択される (board_build.core=MiniCore)
upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
  -P$UPLOAD_PORT
  -e
lib_deps =
  gin66/FastAccelStepper@^0.34.0  ; semver 互換範囲 (0.34.x) で固定
  pololu/FastGPIO                 ; 328PB 対応済、変更不要
lib_ldf_mode = chain+
extra_scripts = pre:scripts/patch_fastaccel.py

; -----------------------------------------------------------------------------
; 共通: ATmega328PB (MiniCore の PB バリアント)
; -----------------------------------------------------------------------------
[env:atmega328pb]
platform = atmelavr
board = ATmega328PB               ; MiniCore の 328PB バリアント
framework = arduino
upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
  -P$UPLOAD_PORT
  -e
build_flags =
  -DUSE_ATMEGA328PB               ; (任意) コード内で PB 専用機能を有効化する場合のフラグ
lib_deps =
  gin66/FastAccelStepper@^0.34.0
  pololu/FastGPIO
lib_ldf_mode = chain+
extra_scripts = pre:scripts/patch_fastaccel.py
